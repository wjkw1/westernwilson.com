name: CI

# Every PR, not just those into main, so stacked PRs get checked too.
on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest
          extended: true

      - name: Build
        run: hugo --minify

      - name: Install site checks
        run: npm ci --prefix tests

      - name: Accessibility (axe on every page, light and dark)
        run: |
          python3 -m http.server 8080 --directory public >/dev/null 2>&1 &
          BROWSER_PATH="$(command -v google-chrome)" node tests/check-a11y.mjs http://localhost:8080

      - name: Lighthouse
        if: ${{ !cancelled() }}
        run: tests/node_modules/.bin/lhci autorun --config=tests/lighthouserc.json

      - name: Upload Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports
          if-no-files-found: ignore
