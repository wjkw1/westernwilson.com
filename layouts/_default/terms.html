{{ define "main" }}
<div class="space-y-8">
  <h1 class="font-display text-lg uppercase font-semibold mt-0">
    {{ .Title }}
  </h1>
  {{ with .Site.Params.tagsExplainerPath }}
  <p class="text-muted font-medium mt-0 mb-6 inline-links">
    See what these tags mean and how I use them
    <a href="{{ . | relURL }}">on this post</a>.
  </p>
  {{ end }}

  <ul class="list-none m-0 p-0 lowercase">
    {{ range .Data.Terms.Alphabetical }}
    <li class="py-3 border-b border-line last:border-b-0">
      <a
        href="{{ .Page.RelPermalink }}"
        class="text-heading no-underline! hover:text-accent"
      >
        {{ .Page.Title }}
        <span class="text-muted text-sm">({{ .Count }})</span>
      </a>
    </li>
    {{ end }}
  </ul>
</div>
{{ end }}
