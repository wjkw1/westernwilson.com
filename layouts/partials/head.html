<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if not .IsHome }}{{ .Title }} · {{ end }}{{ .Site.Title }}</title>
{{ with .Description | default .Params.description }}
<meta name="description" content="{{ . | markdownify | plainify }}">
{{ else }}
{{ with .Site.Params.description }}<meta name="description" content="{{ . }}">{{ end }}
{{ end }}
<link rel="canonical" href="{{ .Permalink }}">
{{ with .Site.Params.favicon }}<link rel="icon" href="{{ . | absURL }}">{{ end }}

{{- $css := resources.Get "css/main.css" | css.TailwindCSS | resources.Fingerprint }}
<link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">

<script>
  // Apply the saved color scheme before first paint to avoid a flash.
  // "light" / "dark" pin the scheme; no saved value means follow the system.
  (function() {
    try {
      localStorage.removeItem('theme'); // legacy key that pinned every visitor
      var pref = localStorage.getItem('color-scheme');
      if (pref === 'dark' || pref === 'light') {
        document.documentElement.setAttribute('data-theme', pref);
      }
    } catch (e) {}
  })();
</script>
