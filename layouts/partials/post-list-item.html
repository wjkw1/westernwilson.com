<li class="py-4 flex items-start justify-between gap-4 border-b border-line last:border-b-0">
  <div class="min-w-0">
    <a href="{{ .RelPermalink }}" class="link-sweep text-heading font-medium">
      {{ .Title }}
    </a>
    {{ with .GetTerms "tags" }}
    <div class="mt-2">{{ partial "tags.html" $ }}</div>
    {{ end }}
  </div>
  {{ if ne .Kind "term" }}
  <p class="flex flex-col items-end gap-1 shrink-0 m-0 text-sm text-muted whitespace-nowrap">
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2006" }}</time>
    <span class="text-xs">{{ .ReadingTime }} min read</span>
  </p>
  {{ end }}
</li>
