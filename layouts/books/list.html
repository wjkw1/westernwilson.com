{{ define "main" }}
<div>
  <h1 class="font-display text-3xl font-semibold leading-tight mt-0 mb-3">{{ .Title }}</h1>
  {{ with .Params.description }}
  <p class="text-muted text-sm mb-8 leading-relaxed inline-links">{{ . | markdownify }}</p>
  {{ end }}
  <ul class="list-none m-0 p-0">
    {{ range $i, $book := sort .Pages "Params.dateRead" "desc" }}
    {{ partial "book-list-item.html" (dict "page" $book "index" $i) }}
    {{ end }}
  </ul>
</div>
{{ end }}
