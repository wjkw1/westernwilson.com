baseURL: "https://westernwilson.com/"
locale: en
title: Western Wilson

enableRobotsTXT: true

pagination:
  pagerSize: 10

services:
  rss:
    limit: 20

params:
  author: Western Wilson
  description: "Kia ora, I'm Western Wilson 👋"
  keywords: "blog, reflections, software, engineering, technology, devops"
  avatar: images/western.png
  avatarAlt: Western Wilson
  logo: images/logo.png

  colorScheme: auto
  hideColorSchemeToggle: false

  tagsExplainerPath: /reflections/how-i-use-tags/

  social:
    - name: GitHub
      weight: 1
      url: "https://github.com/wjkw1"
      icon: github
      rel: me noopener
    - name: LinkedIn
      weight: 2
      url: "https://www.linkedin.com/in/western-wilson"
      icon: linkedin
      rel: me noopener
    - name: Goodreads
      weight: 4
      url: "https://www.goodreads.com/wjkw1"
      icon: goodreads
      rel: me noopener
    - name: Email
      weight: 5
      url: "mailto:kiaora@westernwilson.com"
      icon: envelope
      rel: me

menu:
  main:
    - name: Now
      weight: 1
      url: /now/
    - name: Reflections
      weight: 2
      url: /reflections/
    - name: Books
      weight: 3
      url: /books/
    - name: Techstack
      weight: 4
      url: /techstack/

security:
  exec:
    allow:
      - '^(dart-)?sass$'
      - '^go$'
      - '^git$'
      - '^node$'
      - '^npx$'
      - '^postcss$'
      - '^tailwindcss$'

markup:
  highlight:
    noClasses: false
